name: Backend tests

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend_tests.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend_tests.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python3 -m unittest discover -s backend/tests -v
