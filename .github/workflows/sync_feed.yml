name: Build and Publish NYC Dance Calendar Feed

on:
  schedule:
    # Run every 3 hours between 7am and 11pm Eastern (approx 10:00 UTC to 04:00 UTC)
    - cron: '0 10,13,16,19,22,1 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Feed Aggregator
        run: |
          python3 backend/src/build_feed.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare GitHub Pages directory
        run: |
          mkdir -p _site
          cp backend/data/schedule.json _site/schedule.json
          cat << 'EOF' > _site/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>NYC Solo Dance Calendar Feed</title>
          </head>
          <body>
            <h1>NYC Solo Dance Calendar Feed</h1>
            <p>Access the latest JSON schedule feed at <a href="schedule.json">schedule.json</a>.</p>
          </body>
          </html>
          EOF

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
